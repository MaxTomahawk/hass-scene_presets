name: Feature CI

on:
  push:
    branches:
      - feature/manual-change-and-user-favorites

permissions:
  contents: write

jobs:
  test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python test dependencies
        run: python -m pip install pytest voluptuous
      - name: Run Python tests
        run: pytest -q
      - name: Compile Python sources
        run: python -m compileall -q custom_components/scene_presets
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Commit generated frontend bundle
        shell: bash
        run: |
          if git diff --quiet -- custom_components/scene_presets/frontend/scene_presets_panel.js; then
            echo "Frontend bundle already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/scene_presets/frontend/scene_presets_panel.js
          git commit -m "build: update scene presets frontend"
          git push

  verify-generated:
    if: github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest voluptuous
      - run: pytest -q
      - run: python -m compileall -q custom_components/scene_presets
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Verify generated frontend is committed
        run: git diff --exit-code -- custom_components/scene_presets/frontend/scene_presets_panel.js
