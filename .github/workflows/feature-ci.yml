name: Feature CI

on:
  push:
    branches:
      - feature/manual-change-and-user-favorites

permissions:
  contents: write

jobs:
  test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python test dependencies
        run: python -m pip install pytest voluptuous
      - name: Run Python tests
        run: pytest -q
      - name: Compile Python sources
        run: python -m compileall -q custom_components/scene_presets
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Apply feature frontend source transform
        run: |
          python scripts/apply_feature_frontend.py
          python scripts/fix_feature_frontend_review.py
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Commit frontend source and generated bundle
        shell: bash
        run: |
          PATHS=(
            js/pages/PresetApplyPage.tsx
            js/components/DynamicSceneTile.tsx
            custom_components/scene_presets/frontend/scene_presets_panel.js
          )
          if git diff --quiet -- "${PATHS[@]}"; then
            echo "Frontend source and bundle already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${PATHS[@]}"
          git commit -m "feat: add manual-stop and user favorites frontend"
          git push

  verify-generated:
    if: github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest voluptuous
      - run: pytest -q
      - run: python -m compileall -q custom_components/scene_presets
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: |
          python scripts/apply_feature_frontend.py
          python scripts/fix_feature_frontend_review.py
      - run: npm run lint
      - run: npm run build
      - name: Verify frontend source and bundle are committed
        run: git diff --exit-code -- js/pages/PresetApplyPage.tsx js/components/DynamicSceneTile.tsx custom_components/scene_presets/frontend/scene_presets_panel.js
