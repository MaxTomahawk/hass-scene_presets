name: Feature CI

on:
  push:
    branches:
      - feature/manual-change-and-user-favorites

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python test dependencies
        run: python -m pip install pytest voluptuous
      - name: Run Python tests
        run: pytest -q
      - name: Compile Python sources
        run: python -m compileall -q custom_components/scene_presets
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Verify generated frontend bundle is committed
        run: git diff --exit-code -- custom_components/scene_presets/frontend/scene_presets_panel.js
