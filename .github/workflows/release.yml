name: Release

on:
  push:
    branches:
      - master
    paths:
      - custom_components/scene_presets/manifest.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read integration version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("custom_components/scene_presets/manifest.json"))["version"])')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          TAG="v${VERSION}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
            exit 0
          fi

          NOTES_FILE=".github/releases/${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes
          fi
