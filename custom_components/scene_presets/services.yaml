apply_preset:
  name: "Apply preset"
  description: Apply a scene preset to specified light entities
  fields:
    preset_id:
      name: "Preset"
      description: "The preset ID to use"
      example: "Rest"
      required: true
      selector:
        text: null
    targets:
      name: "Targets"
      description: "What to apply the preset to"
      required: true
      selector:
        target:
          entity:
            domain:
              - light
              - group
    brightness:
      name: "Brightness"
      description: "Override the presets brightness"
      example: 150
      selector:
        number:
          min: 0
          max: 255
    transition:
      name: "Transition"
      description: "Transition duration between states"
      example: 1
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: seconds
    shuffle:
      name: "Shuffle"
      description: "Shuffle the colors before applying"
      example: true
      selector:
        boolean:
    smart_shuffle:
      name: "Smart shuffle"
      description: "Ensure smooth color transitions when shuffling"
      example: true
      selector:
        boolean:

get_dynamic_scenes:
  name: "Get dynamic scenes"
  description: Get all currently active dynamic scenes

start_dynamic_scene:
  name: "Start dynamic scene"
  description: Start a loop that periodically applies a shuffled scene preset
  fields:
    preset_id:
      name: "Preset"
      description: "The preset ID to use"
      example: "Rest"
      required: true
      selector:
        text: null
    targets:
      name: "Targets"
      description: "What to apply the preset to"
      required: true
      selector:
        target:
          entity:
            domain:
              - light
              - group
    brightness:
      name: "Brightness"
      description: "Override the presets brightness"
      example: 150
      selector:
        number:
          min: 0
          max: 255
    transition:
      name: "Transition"
      description: "Transition duration between states"
      example: 1
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: seconds
    interval:
      name: "Interval"
      description: "Time between color changes"
      example: 60
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: seconds
    stop_on_manual_change:
      name: "Stop on manual change"
      description: "Stops the dynamic scene when any target light is turned off or its color is changed outside this dynamic scene. Brightness-only changes are ignored."
      example: true
      selector:
        boolean:

stop_dynamic_scene:
  name: "Stop dynamic scene"
  description: Stop a dynamic scene by ID
  fields:
    id:
      name: ID
      description: "The UUID of the dynamic scene to stop"
      required: true
      example: "d1db9696-e8ef-41b7-ba71-af696ee89b28"
      selector:
        text: null

stop_dynamic_scenes_for_targets:
  name: "Stop dynamic scenes for targets"
  description: Stops all dynamic scenes that include any of the specified targets
  fields:
    targets:
      name: "Targets"
      description: "Targets to stop all dynamic scenes for"
      required: true
      selector:
        target:
          entity:
            domain:
              - light
              - group

stop_all_dynamic_scenes:
  name: "Stop all dynamic scenes"
  description: Stops all currently running dynamic scenes

get_favorites:
  name: "Get favorites"
  description: Return the current Home Assistant user's favorite preset IDs for use with response_variable in scripts and automations

is_favorite:
  name: "Is favorite"
  description: Return whether a preset is a favorite for the current Home Assistant user
  fields:
    preset_id:
      name: "Preset"
      description: "The preset ID to check"
      required: true
      selector:
        text:

add_favorite:
  name: "Add favorite"
  description: Add a preset to the current Home Assistant user's favorites
  fields:
    preset_id:
      name: "Preset"
      description: "The preset ID to add"
      required: true
      selector:
        text:

remove_favorite:
  name: "Remove favorite"
  description: Remove a preset from the current Home Assistant user's favorites
  fields:
    preset_id:
      name: "Preset"
      description: "The preset ID to remove"
      required: true
      selector:
        text:

toggle_favorite:
  name: "Toggle favorite"
  description: Toggle a preset in the current Home Assistant user's favorites
  fields:
    preset_id:
      name: "Preset"
      description: "The preset ID to toggle"
      required: true
      selector:
        text:
